name: Java Backend CI with Maven

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: pregnancy_care_db
          MYSQL_USER: devuser
          MYSQL_PASSWORD: devpassword
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'oracle'
          cache: 'maven'

      - name: Build and Test Java Backend
        working-directory: ./server
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3307/pregnancy_care_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: devuser
          DB_PASSWORD: devpassword
          JWT_SECRET: UltraSecureKey_ForJWT_TokenSigning_2026!
          JWT_EXPIRATION: 3600
        run: mvn clean test
