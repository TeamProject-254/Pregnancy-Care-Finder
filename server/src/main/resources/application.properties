# Server configuration
server.port=${PORT:8080}
server.error.include-stacktrace=never

# Database configuration (Aiven / Local Docker)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/pregnancy_care_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security
jwt.secret=${JWT_SECRET:dev_secure_fallback_key_change_me_in_production_987654321}
jwt.expiration=${JWT_EXPIRATION:3600}

# Frontend CORS / Redirect URL
app.frontend.url=https://teamproject-254.github.io/Pregnancy-Care-Finder/#

# Mail configuration (Mailtrap / External SMTP)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:c7d7ccb88bd9c8}
spring.mail.password=${MAIL_PASSWORD:b12e76e2a164ec}

# MVC / Web configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.sql.init.mode=always